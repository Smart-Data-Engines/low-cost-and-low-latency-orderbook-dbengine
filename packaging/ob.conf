# ob_tcp_server configuration.
#
# Keys are flag names without the dashes; `ob_tcp_server --print-config` shows the resolved values
# with the provenance of each one. A key this binary does not know stops the start rather than being
# ignored, so a typo here is loud.
#
# This file is what the package ships, and it configures a **single node with no coordinator**.
# Everything that needs infrastructure is commented out, because a configuration naming an etcd that
# is not there is refused by validation — a package whose default configuration does not start is
# worse than no package.

port          = 9090
data-dir      = /var/lib/orderbook
log-level     = INFO

# How many client connections this node accepts. Each one costs a file descriptor; see LimitNOFILE
# in the systemd unit, which is derived from this.
max-sessions  = 64

# Background flush interval. Shorter means less unflushed data at any moment and more segment
# writes; longer means the opposite. It decides how much sits in the WAL rather than in a segment,
# which is exactly what crash recovery has to deal with.
flush-interval-ms = 100

# When the write-ahead log becomes durable: every, interval or none.
#
# `interval` is the default. Choose per storage device: on an NVMe with power-loss protection an
# fsync per record is a cost with no matching guarantee, and without that protection an acknowledged
# write that was not fsynced is a write you can lose. See docs/operations.md.
# fsync-policy = interval

# Prometheus metrics. 0 disables the endpoint.
# metrics-port = 9100


# ── High availability ─────────────────────────────────────────────────────────
#
# Uncomment together with a reachable etcd. `failover-enabled` defaults to true, so leaving these
# unset means a standalone node that never campaigns — which is what a single-node install wants.
#
# node-id               = node-1
# coordinator-endpoints = http://127.0.0.1:2379
# coordinator-lease-ttl = 10
#
# A candidate waits out the previous holder's step-down bound before claiming a vacated leader key.
# That is why failover takes about twice as long as it used to, deliberately: the alternative makes
# a primary read-only during a brief etcd hiccup.
# election-lease-wait-ms = 0


# ── Single-primary replication ────────────────────────────────────────────────
#
# On the primary, the port replicas connect to:
# replication-port = 9091
#
# On a replica, where its primary is:
# primary-host = 10.0.0.1
# primary-port = 9091


# ── Multi-master ──────────────────────────────────────────────────────────────
#
# Every node accepts writes; conflicts resolve by HLC plus last-writer-wins. Requires
# coordinator-endpoints above, a distinct mm-node-id per node, and a port for the peer mesh.
# Incompatible with primary-host/primary-port and with read-only, and the start refuses the
# combination rather than picking one.
#
# multi-master        = true
# mm-node-id          = 1
# mm-replication-port = 9092


# ── Streaming subscriptions ───────────────────────────────────────────────────
#
# A subscriber past this much queued output is disconnected rather than throttled: about 60 bytes a
# row, so 8 MiB is roughly 140 000 rows of backlog. A consumer that has not read that many is absent
# rather than slow.
# max-subscriber-queue-bytes    = 8388608
# max-subscriptions-per-session = 16
