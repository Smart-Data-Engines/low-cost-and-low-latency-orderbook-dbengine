name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so new queries run against unchanged code too.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev liburing-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      # Tests are excluded from the scan to keep analysis time down; the point is
      # to analyse shipped code.
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DOB_BUILD_TESTS=OFF
          cmake --build build -j$(nproc)

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:c-cpp
