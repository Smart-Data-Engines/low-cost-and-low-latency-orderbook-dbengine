name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so new queries run against unchanged code too.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev liburing-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
          # Half of the open alerts in this repository were in build/_deps - nlohmann/json's headers,
          # pulled in by FetchContent and then analysed as though we wrote them. Fifteen findings we
          # will never act on, sitting in the same list as the ones we should, which is how a real
          # finding goes unread. Excluded by path rather than dismissed one at a time, because the
          # next dependency bump would bring them back.
          config: |
            paths-ignore:
              - build/**
              - tests/**

      # Tests are excluded from the scan to keep analysis time down; the point is
      # to analyse shipped code.
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DOB_BUILD_TESTS=OFF
          cmake --build build -j$(nproc)

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          category: /language:c-cpp
