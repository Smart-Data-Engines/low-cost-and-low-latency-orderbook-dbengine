name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so new queries run against unchanged code too.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev liburing-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
          # No `paths-ignore` here, and its absence is deliberate rather than an omission: it was
          # added in the previous commit to exclude build/_deps and it did not work. `paths` and
          # `paths-ignore` only apply to interpreted languages; for a compiled one CodeQL analyses
          # what the build compiles, and nlohmann/json is header-only, so its headers are extracted
          # through our own translation units. The analysis after that change still reported 45
          # results - the same 45 - which is how this is known rather than assumed. The config was
          # removed instead of left in place, because configuration that looks load-bearing and is
          # not is worse than none: the next person reads it as a filter that works.
          #
          # The 30 vendored findings are dismissed as `won't fix` with a reason on each alert, which
          # is the mechanism that does work here. See docs/github-security.md for the count and the
          # open question about the query suite.

      # Tests are excluded from the scan to keep analysis time down; the point is
      # to analyse shipped code.
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DOB_BUILD_TESTS=OFF
          cmake --build build -j$(nproc)

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          category: /language:c-cpp
