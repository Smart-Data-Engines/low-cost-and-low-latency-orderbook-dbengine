name: release

# A release is a tag, and nothing else (#42, docs/releasing.md).
#
# The filename matters: PyPI's trusted publisher is bound to `release.yml`, so renaming this file
# revokes publishing, and the symptom is a failed release rather than a warning.
# `scripts/release.py check` holds the name, the triggers and the pins below.
#
# There is deliberately no `workflow_dispatch`: a manual trigger is a publish with no tag behind it.
# And no `pull_request`: everything this does but publish runs on every pull request already, in
# ci.yml's `package` and `package-arm64`, through the same scripts/package_ci.sh - required checks,
# where a job here would be one that runs and gates nothing (.github/rulesets/check_contexts.py).
#
# Third-party actions are pinned to full commit SHAs with the version in a trailing comment, as in
# ci.yml. An annotated tag resolves with `git ls-remote '...^{}'`: pypa/gh-action-pypi-publish
# v1.14.2's tag object is a892a5a6, its commit dc37677b - and pinning the tag object pins nothing
# Dependabot can bump.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never cancel a publish in flight: a second tag pushed a minute later must not interrupt an upload
# half-way, and PyPI does not hand a version number back.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The ancestry check needs history, and a shallow clone answers it wrongly rather than
          # refusing to answer.
          fetch-depth: 0

      - name: The tag names CMakeLists.txt's version, and CHANGELOG.md says what it releases
        id: version
        run: |
          set -euo pipefail
          python3 scripts/release.py check
          python3 scripts/release.py gate "$GITHUB_REF" >> "$GITHUB_OUTPUT"

      - name: The tagged commit is on master, so it passed the required checks
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            echo "::error::commit $GITHUB_SHA is not an ancestor of master, so it never passed the"
            echo "::error::required checks. The ruleset protects master; it does not stop a tag from"
            echo "::error::being pointed at any commit. Merge first, then tag the merge."
            exit 1
          fi
          echo "$GITHUB_SHA is on master"

  packages:
    name: packages (${{ matrix.runner }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        # One axis, the runner; the architecture is the runner's (`runner.arch`). Ubuntu 22.04, as in
        # ci.yml's package jobs, so the packages run where glibc is 2.34 (#212).
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-12 liblz4-dev libzstd-dev libcurl4-openssl-dev libssl-dev rpm python3-venv

      - name: Build, package, check, install and accept - as on every pull request
        env:
          CC: gcc-12
          CXX: g++-12
        run: ./scripts/package_ci.sh build-pkg dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-${{ runner.arch }}
          path: |
            build-pkg/orderbook-dbengine_*.deb
            build-pkg/orderbook-dbengine-*-Linux-*.tar.gz
            build-pkg/orderbook-dbengine-*.rpm
          if-no-files-found: error

      # The wheel and the sdist are the same on both runners - pure Python - so one of them uploads.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: matrix.runner == 'ubuntu-22.04'
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [gate, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'release/*'

      - name: Create the release, with CHANGELOG.md's section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release.py notes "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "orderbook-dbengine $VERSION" --notes-file notes.md

  publish-pypi:
    name: publish to PyPI
    needs: [gate, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A person, not a merge: the environment carries the required reviewer, and PyPI's trusted
    # publisher names this environment too, so a token minted by any other job is refused there.
    environment:
      name: pypi
      url: https://pypi.org/project/orderbook-dbengine/${{ needs.gate.outputs.version }}/
    permissions:
      # The whole credential: no token exists in this repository or its secrets.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
