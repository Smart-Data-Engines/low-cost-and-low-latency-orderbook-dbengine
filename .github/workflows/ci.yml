name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and fast, so it runs on its own rather than behind a 45-minute build.
  docs-integrity:
    name: docs-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Check roadmap item ids and cross-references
        run: python3 scripts/check_roadmap.py

      - name: Check every metric written by name is registered
        run: python3 scripts/check_metrics.py

      - name: The ruleset still gates what the workflows produce
        # A warning in docs/github-security.md until this step, and the warning was already being
        # ignored: sanitizers (asan) and sanitizers (tsan) ran on every PR and gated nothing, and
        # .github/rulesets/master.json had lost analyze (c-cpp) relative to the live ruleset. Both
        # states look like green.
        run: |
          python3 -m pip install -q pyyaml
          python3 .github/rulesets/check_contexts.py

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev liburing-dev

      # etcd runs natively, like the engine itself. No containers in the test path.
      - name: Install etcd
        env:
          ETCD_VER: v3.5.17
        run: |
          curl -fsSL "https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz" | tar xz
          sudo install -m755 "etcd-${ETCD_VER}-linux-amd64/etcd" "etcd-${ETCD_VER}-linux-amd64/etcdctl" /usr/local/bin/
          etcd --version

      - name: Start etcd
        run: |
          etcd --name ci-etcd --data-dir /tmp/ci-etcd \
            --advertise-client-urls http://127.0.0.1:2379 \
            --listen-client-urls http://127.0.0.1:2379 \
            > /tmp/ci-etcd.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:2379/version && break
            sleep 1
          done
          curl -sf http://127.0.0.1:2379/version

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      # -j1 is mandatory: network tests bind fixed ports and fail under parallel execution.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j1


  # The whole pytest suite against a plain build, on every pull request.
  #
  # The other half of #55, and the half that matters most: the sanitizer variant of this job runs
  # only the multi-master modules, because instrumentation makes the fixtures that kill nodes wait
  # on timings they cannot rely on. Uninstrumented, those modules are exactly the ones worth
  # gating — failover, crash recovery, and the position-lease invariant that #72 and #74 turned on.
  #
  # Kept separate from build-and-test rather than appended to it: that job is the C++ suite and
  # should stay readable as such, and a failure here means something different from a failure
  # there.
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev liburing-dev

      # etcd runs natively, like the engine itself. No containers in the test path.
      - name: Install etcd
        env:
          ETCD_VER: v3.5.17
        run: |
          curl -fsSL "https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz" | tar xz
          sudo install -m755 "etcd-${ETCD_VER}-linux-amd64/etcd" "etcd-${ETCD_VER}-linux-amd64/etcdctl" /usr/local/bin/
          etcd --version

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # ob_integration_test as well as the server: test_cpp_client.py skips itself when that binary
      # is absent, and the first run of this job skipped seven tests for exactly that reason while
      # reporting green on the rest. A test that skips itself because the harness did not build it
      # is the same failure mode as a check that runs and gates nothing.
      - name: Build the server and the C++ client harness
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j$(nproc) --target ob_tcp_server ob_integration_test

      - name: Install Python package and test extras
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -e ".[test]"

      # The harness starts its own etcd per cluster, so nothing is started here. Binance tests are
      # opt-in and stay skipped without OB_BINANCE_TESTS.
      - name: Run the integration suite
        env:
          OB_INTEGRATION_TESTS: "1"
        run: |
          PYTHONPATH=$PWD/python .venv/bin/python -m pytest tests/integration/ -q \
            --junitxml=integration-report.xml

      # A skip is a test that did not run, and the only ones this job accepts are the two Binance
      # tests that need a live feed. Anything else — a binary the build step forgot, a fixture that
      # gave up, a marker added without thinking — would otherwise pass as green.
      - name: No test may skip except the two opt-in Binance ones
        if: always()
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse("integration-report.xml")
          skipped = [
              (case.get("classname", ""), case.get("name", ""),
               (case.find("skipped").get("message") or "").splitlines()[0][:160])
              for case in tree.iter("testcase")
              if case.find("skipped") is not None
          ]
          for classname, name, why in skipped:
              print(f"skipped: {classname}::{name} — {why}")
          # Matched on classname *and* name: a module skipped at collection time — which is how
          # the Binance ones skip, on a marker — lands in the report with an empty classname.
          allowed = [s for s in skipped if "binance" in (s[0] + " " + s[1]).lower()]
          if len(skipped) != len(allowed):
              print(f"\n{len(skipped) - len(allowed)} unexpected skip(s); only the Binance "
                    f"tests may skip in this job")
              sys.exit(1)
          print(f"\n{len(skipped)} skipped, all of them Binance opt-ins")
          PY

  release-build:
    name: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev liburing-dev

      - name: Configure (Release, no tests)
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DOB_BUILD_TESTS=OFF

      - name: Build server
        run: cmake --build build-release -j$(nproc)

      - name: Smoke check
        run: |
          ./build-release/ob_tcp_server --port 5599 --data-dir /tmp/ci-smoke &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if printf 'PING\n' | timeout 2 nc -q1 127.0.0.1 5599 | grep -q PONG; then
              echo "PONG received"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "server did not answer PING"
          kill $SERVER_PID || true
          exit 1

  # Clang, because the README and CLAUDE.md both claim GCC >= 12 / Clang >= 15 and nothing had ever
  # checked the second half of that sentence.
  #
  # One job rather than a GCC/Clang x Debug/Release matrix: build-and-test already covers GCC Debug
  # with the full suite and release-build covers GCC Release, so a matrix would spend most of its
  # time re-running what is already required. The missing combination was Clang, and this covers
  # both configurations of it.
  clang-build:
    name: clang-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang \
            liblz4-dev libcurl4-openssl-dev liburing-dev
          clang++ --version

      # etcd for the handful of C++ tests that talk to a coordinator.
      - name: Install etcd
        env:
          ETCD_VER: v3.5.17
        run: |
          curl -fsSL "https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz" | tar xz
          sudo install -m755 "etcd-${ETCD_VER}-linux-amd64/etcd" "etcd-${ETCD_VER}-linux-amd64/etcdctl" /usr/local/bin/

      - name: Start etcd
        run: |
          etcd --name ci-etcd --data-dir /tmp/ci-etcd \
            --advertise-client-urls http://127.0.0.1:2379 \
            --listen-client-urls http://127.0.0.1:2379 \
            > /tmp/ci-etcd.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:2379/version && break
            sleep 1
          done
          curl -sf http://127.0.0.1:2379/version

      - name: Configure and build with clang (Debug)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-clang -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-clang -j$(nproc)

      # -j1 for the same reason as everywhere else: the networking tests bind fixed ports.
      - name: Test (clang, Debug)
        run: ctest --test-dir build-clang --output-on-failure -j1

      # Release too, because -O2/-O3 turns on diagnostics that -O0 does not reach — the class of
      # warning that only appears once the optimiser can see through a function.
      - name: Configure and build with clang (Release)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-clang-release -DCMAKE_BUILD_TYPE=Release -DOB_BUILD_TESTS=OFF
          cmake --build build-clang-release -j$(nproc)

  # Line coverage over the engine's own sources, reported and not (yet) gated.
  #
  # Required, and gated on a floor taken from a measurement rather than from taste.
  #
  # The first honest run reported **61.0% of 11352 lines** (functions 72.5%, branches 33.4%) across
  # 33 source files. Before #83 the same option reported "59.0% of 2387 lines" over 6 files — nearly
  # the same percentage of an unrepresentative sixth, which is what made it worth nothing.
  #
  # The floor is 58%: three points of slack, so ordinary churn does not trip it and a real drop does.
  # Branches are not gated — 33% is too far from anything to be a useful ratchet yet, and a floor
  # nobody can raise is a floor nobody respects.
  #
  # It also gates three things that are not percentages: the tree builds with coverage, the suite
  # passes under it, and the instrumentation still reaches the libraries. The last of those failed
  # silently for as long as the option existed.
  #
  # No third-party service. Every coverage badge on offer means sending reports from a public
  # repository to somebody else's account, which is a decision with an owner rather than a task, so
  # the number lands in the job summary and stays here.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev liburing-dev
          python3 -m pip install --quiet gcovr

      # etcd for the C++ tests that talk to a coordinator; without it their lines read as uncovered
      # and the number understates the suite rather than describing it.
      - name: Install etcd
        env:
          ETCD_VER: v3.5.17
        run: |
          curl -fsSL "https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz" | tar xz
          sudo install -m755 "etcd-${ETCD_VER}-linux-amd64/etcd" "etcd-${ETCD_VER}-linux-amd64/etcdctl" /usr/local/bin/

      - name: Configure and build with coverage
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DOB_ENABLE_COVERAGE=ON
          cmake --build build-cov -j$(nproc)

      # A quick check that the instrumentation actually reached the libraries, because that is the
      # defect this job was born out of and it failed silently for as long as it existed (#83).
      - name: The instrumentation must reach the libraries
        run: |
          for target in orderbook_engine orderbook_multi_master orderbook_failover; do
            flags="build-cov/CMakeFiles/${target}.dir/flags.make"
            if ! grep -q -- "--coverage" "$flags"; then
              echo "::error::${target} is not instrumented; coverage would describe part of the tree"
              exit 1
            fi
            echo "${target}: instrumented"
          done

      - name: Run the suite
        run: ctest --test-dir build-cov --output-on-failure -j1

      - name: Report coverage
        run: |
          # negative_hits.warn: gcov emits negative execution counts for a few of wal.cpp's lines,
          # and gcovr treats an unparseable count as fatal by default. They come from tests that
          # abandon a process on purpose — crash recovery is tested by killing the engine rather than
          # closing it — which leaves a partially written .gcda. Warn and carry on: the alternative is
          # no coverage number at all, and the lines affected are the ones a deliberately killed
          # process was executing.
          #
          # It did not appear locally before this change, for the reason this change is about:
          # wal.cpp was not instrumented.
          gcovr --root . \
                --filter 'src/' --filter 'include/orderbook/' \
                --exclude 'tests/' --exclude 'build.*' \
                --gcov-ignore-parse-errors=negative_hits.warn \
                --txt-metric line --print-summary \
                --txt coverage.txt --json-summary coverage.json
          {
            echo '### Line coverage'
            echo
            echo '```'
            python3 -c "
          import json
          d = json.load(open('coverage.json'))
          print(f\"lines     {d['line_percent']:.1f}%  ({d['line_covered']}/{d['line_total']})\")
          print(f\"functions {d['function_percent']:.1f}%  ({d['function_covered']}/{d['function_total']})\")
          print(f\"branches  {d['branch_percent']:.1f}%  ({d['branch_covered']}/{d['branch_total']})\")
          "
            echo '```'
            echo
            echo '<details><summary>Per file</summary>'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Line coverage must not fall below the floor
        run: |
          python3 - <<'PY'
          import json, sys
          FLOOR = 58.0
          d = json.load(open("coverage.json"))
          pct = d["line_percent"]
          print(f"line coverage {pct:.1f}% (floor {FLOOR}%), {d['line_covered']}/{d['line_total']} lines")
          if pct < FLOOR:
              print(f"::error::line coverage {pct:.1f}% is below the {FLOOR}% floor")
              sys.exit(1)
          PY

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.json

  # Sanitizers on the C++ unit suite. Both were clean when introduced, and each found a real defect
  # on the way in: UBSan a misaligned reference binding caused by packing HLCTimestamp (roadmap
  # #37), TSan a shutdown that closed the epoll descriptor while the io thread was still inside
  # epoll_wait().
  #
  # This used to carry a note explaining that running the integration suite under a sanitizer would
  # "multiply the runtime without adding coverage of anything the unit tests do not reach". That
  # turned out to be wrong, and expensively so: thirteen seconds of test_mm_convergence.py against a
  # TSan build reported a lock-order inversion on all three nodes and seventeen data races on the
  # shutdown path (#80). Unit tests never start a server process with real clients, real peers and a
  # signal-driven shutdown, so that whole class was outside the reach of a job that exists to find
  # it. Hence the second job below.
  sanitizers:
    name: sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev liburing-dev

      # ThreadSanitizer refuses to start when the kernel hands out more ASLR entropy than its
      # shadow mapping allows: "FATAL: ThreadSanitizer: unexpected memory mapping". Ubuntu 24.04
      # defaults to 32 bits; 28 is what TSan can live with. Harmless for the ASan job, so it is not
      # conditional.
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DOB_ENABLE_ASAN=ON
          else
            cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DOB_ENABLE_TSAN=ON
          fi

      - name: Build
        run: cmake --build build-san -j$(nproc)

      # -j1 for the same reason as the ordinary suite: the networking tests bind ports.
      - name: Run tests
        env:
          # detect_leaks is on: a leak in a long-lived server process is a defect, not noise.
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1
        run: ctest --test-dir build-san --output-on-failure -j1

  # The integration suite under ThreadSanitizer, with the deadlock detector on.
  #
  # A separate job rather than a matrix entry on the one above, because it needs etcd, Python and a
  # live cluster, and because what it looks for is different: lock order and cross-thread access in
  # a running server, not memory errors in a unit test. Any report at all fails the job — TSan runs
  # with halt_on_error=0 so that one finding does not hide the next, which means pytest can pass
  # while the logs are full.
  #
  # Scope is the multi-master modules: they are the ones that drive both lock orders at once (a
  # client write going Engine -> MM against a received delta going MM -> Engine). The modules that
  # kill nodes are left out for now — their fixtures wait on timeouts that instrumentation makes
  # unreliable, and a flaky required check teaches people to ignore checks.
  sanitizers-integration:
    name: sanitizers-integration (tsan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev liburing-dev

      - name: Install etcd
        run: |
          ETCD_VER=v3.5.17
          curl -sSL https://github.com/etcd-io/etcd/releases/download/$ETCD_VER/etcd-$ETCD_VER-linux-amd64.tar.gz | tar xz
          sudo install -m755 etcd-$ETCD_VER-linux-amd64/etcd etcd-$ETCD_VER-linux-amd64/etcdctl /usr/local/bin/
          etcd --version

      # Same reason as the job above: TSan refuses to start under Ubuntu 24.04's default ASLR
      # entropy.
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure and build the server under TSan
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DOB_ENABLE_TSAN=ON -DOB_BUILD_TESTS=OFF
          cmake --build build-tsan -j$(nproc) --target ob_tcp_server

      - name: Install Python package and test extras
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -e ".[test]"

      - name: Run the multi-master modules against the TSan server
        env:
          OB_INTEGRATION_TESTS: "1"
          OB_SERVER_BINARY: ${{ github.workspace }}/build-tsan/ob_tcp_server
          TSAN_OPTIONS: detect_deadlocks=1:second_deadlock_stack=1:halt_on_error=0:log_path=${{ github.workspace }}/tsan-report
        run: |
          PYTHONPATH=$PWD/python .venv/bin/python -m pytest -q \
            tests/integration/test_mm_convergence.py \
            tests/integration/test_mm_stats.py \
            tests/integration/test_mm_snapshot_bootstrap.py

      - name: Fail on any ThreadSanitizer report
        run: |
          shopt -s nullglob
          reports=(tsan-report.*)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No ThreadSanitizer reports."
            exit 0
          fi
          echo "ThreadSanitizer wrote ${#reports[@]} report file(s):"
          for f in "${reports[@]}"; do
            echo "──────── $f ────────"
            cat "$f"
          done
          exit 1
