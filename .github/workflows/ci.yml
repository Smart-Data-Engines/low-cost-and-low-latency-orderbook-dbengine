name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and fast, so it runs on its own rather than behind a 45-minute build.
  docs-integrity:
    name: docs-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Check roadmap item ids and cross-references
        run: python3 scripts/check_roadmap.py

      - name: One version, and a release workflow PyPI can trust
        # The version only in CMakeLists.txt, a changelog section for it or for what is unreleased,
        # and release.yml under its name, triggered by tags alone, its actions pinned (#42).
        run: python3 scripts/release.py check

      - name: Check every metric written by name is registered
        run: python3 scripts/check_metrics.py

      - name: What the documents say about coverage is what this workflow enforces
        run: python3 scripts/check_coverage_claim.py

      - name: The comparative table on the front page is the run it cites
        # Unlike the test-suite table, this claim's source of truth is committed beside it, so it
        # is checkable offline - and a claim that can be checked and is not is how this table came
        # to publish two numbers in different units as a ratio. The table has now been rewritten
        # by hand three times; the fourth is checked.
        run: python3 scripts/check_comparative_claim.py

      - name: The ruleset still gates what the workflows produce
        # A warning in docs/github-security.md until this step, and the warning was already being
        # ignored: sanitizers (asan) and sanitizers (tsan) ran on every PR and gated nothing, and
        # .github/rulesets/master.json had lost analyze (c-cpp) relative to the live ruleset. Both
        # states look like green.
        run: |
          python3 -m pip install -q pyyaml
          python3 .github/rulesets/check_contexts.py

      - name: The shipped dashboard and alert rules watch metrics the engine exports
        # Every panel and alert is over a registered metric, no gauge is taken a rate of, every alert
        # has a severity and says what to do - and with promtool every query parses, and every alert
        # fires on the fault it is for and on nothing a healthy node exports (#35). promtool is
        # pinned by version and by the checksum the release publishes.
        env:
          PROM_VER: 2.54.1
          PROM_SHA256: 31715ef65e8a898d0f97c8c08c03b6b9afe485ac84e1698bcfec90fc6e62924f
        run: |
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/prometheus-${PROM_VER}.linux-amd64.tar.gz"
          echo "${PROM_SHA256}  prometheus.tar.gz" | sha256sum -c -
          tar xzf prometheus.tar.gz "prometheus-${PROM_VER}.linux-amd64/promtool"
          export PROMTOOL="$PWD/prometheus-${PROM_VER}.linux-amd64/promtool"
          "$PROMTOOL" check rules packaging/prometheus/orderbook-engine-alerts.yml
          python3 scripts/check_dashboards.py
          python3 scripts/check_alert_rules.py

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev

      # etcd runs natively, like the engine itself. No containers in the test path.
      - name: Install etcd
        env:
          ETCD_VER: v3.5.17
        run: |
          # Retries because this one line has already failed a required check on somebody
          # else's network: `curl: (35) Recv failure: Connection reset by peer`, mid-transfer,
          # on the coverage job of PR #93. A required check that cannot be re-run without a
          # human is a merge block, and an infrastructure block is indistinguishable from a
          # real finding until somebody reads the log.
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz" | tar xz
          sudo install -m755 "etcd-${ETCD_VER}-linux-amd64/etcd" "etcd-${ETCD_VER}-linux-amd64/etcdctl" /usr/local/bin/
          etcd --version

      - name: Start etcd
        run: |
          etcd --name ci-etcd --data-dir /tmp/ci-etcd \
            --advertise-client-urls http://127.0.0.1:2379 \
            --listen-client-urls http://127.0.0.1:2379 \
            > /tmp/ci-etcd.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:2379/version && break
            sleep 1
          done
          curl -sf http://127.0.0.1:2379/version

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      # -j1 is mandatory: network tests bind fixed ports and fail under parallel execution.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j1

      # The failover manager against a real etcd (#202). Not in ctest: the binary starts and stops
      # an etcd of its own, beside the one this job started for ctest's coordinator tests. Until
      # #202 nothing ran it at all, and six of its tests had failed unnoticed, four of them on a
      # real defect (#204). CI=true makes an etcd it cannot start a failure rather than a skip.
      - name: Test against etcd
        run: OB_ETCD_TESTS=1 ./build/tests/test_etcd_integration

      # The aggregation engine's SIMD paths, which a default build does not compile (#207): with
      # OB_ENABLE_AVX2 or OB_ENABLE_AVX512 the build failed under -Werror for as long as nothing built
      # them, and a clean clone failed outright once a compiler targeted x86-64-v3 by default - GCC 15
      # on Ubuntu 26.04 does. Each is built and its properties run against the scalar reference;
      # AVX-512 only where this runner's CPU has it, and the log says so where it does not.
      - name: The AVX2 and AVX-512 builds compile and agree with the scalar reference
        run: |
          for isa in AVX2 AVX512; do
            cmake -S . -B "build-$isa" -DCMAKE_BUILD_TYPE=Release "-DOB_ENABLE_$isa=ON" \
              -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST="$PWD/build/_deps/googletest-src" \
              -DFETCHCONTENT_SOURCE_DIR_BENCHMARK="$PWD/build/_deps/benchmark-src" \
              -DFETCHCONTENT_SOURCE_DIR_RAPIDCHECK="$PWD/build/_deps/rapidcheck-src" \
              -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON="$PWD/build/_deps/nlohmann_json-src"
            cmake --build "build-$isa" -j$(nproc) --target test_aggregation
          done
          ./build-AVX2/tests/test_aggregation
          if grep -qw avx512f /proc/cpuinfo; then
            ./build-AVX512/tests/test_aggregation
          else
            echo "This runner's CPU has no avx512f: the AVX-512 build compiled and was not run."
          fi


  # The whole pytest suite against a plain build, on every pull request.
  #
  # The other half of #55, and the half that matters most: the sanitizer variant of this job runs
  # only the multi-master modules, because instrumentation makes the fixtures that kill nodes wait
  # on timings they cannot rely on. Uninstrumented, those modules are exactly the ones worth
  # gating — failover, crash recovery, and the position-lease invariant that #72 and #74 turned on.
  #
  # Kept separate from build-and-test rather than appended to it: that job is the C++ suite and
  # should stay readable as such, and a failure here means something different from a failure
  # there.
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev

      # etcd runs natively, like the engine itself. No containers in the test path.
      - name: Install etcd
        env:
          ETCD_VER: v3.5.17
        run: |
          # Retries because this one line has already failed a required check on somebody
          # else's network: `curl: (35) Recv failure: Connection reset by peer`, mid-transfer,
          # on the coverage job of PR #93. A required check that cannot be re-run without a
          # human is a merge block, and an infrastructure block is indistinguishable from a
          # real finding until somebody reads the log.
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz" | tar xz
          sudo install -m755 "etcd-${ETCD_VER}-linux-amd64/etcd" "etcd-${ETCD_VER}-linux-amd64/etcdctl" /usr/local/bin/
          etcd --version

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # ob_integration_test as well as the server: test_cpp_client.py skips itself when that binary
      # is absent, and the first run of this job skipped seven tests for exactly that reason while
      # reporting green on the rest. A test that skips itself because the harness did not build it
      # is the same failure mode as a check that runs and gates nothing.
      # ob_cli is exercised by test_cli_tool.py; leaving it out skips that entire module (#110).
      - name: Build the server, CLI, backup tools, C++ client harness and fault injector
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j$(nproc) --target ob_tcp_server ob_cli ob_integration_test obfault \
            ob_restore ob_backup
          # ob_restore and ob_backup are exercised by test_backup.py (#34), which fails without them.
          # obfault is libobfault.so, the storage fault injector (#54). Named here because this job
          # builds targets rather than everything, and the nine tests that LD_PRELOAD it **fail**
          # rather than skip when it is missing - which is how its absence was found, loudly, with
          # the reason printed, instead of nine quiet skips in a summary line (#85's lesson).
          test -f build/tests/libobfault.so

      - name: Install Python package and test extras
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -e ".[test]"

      # The comparative benchmark harness's own tests: `classify()`, the report validator, the
      # generator's determinism, and the static rule that only one file may call one system faster
      # than another. Milliseconds, no engine, no competitors.
      #
      # The comparative **run** deliberately does not happen in CI. A shared runner's noise floor
      # would exceed every difference we would want to publish, and a job that always answers "this
      # machine cannot resolve the comparison" is a job everyone learns to ignore.
      - name: Benchmark harness unit tests
        run: .venv/bin/python -m pytest benchmarks/comparative/tests/ -q

      # The power-cut tests (#160) put a node's data directory on dm-flakey and switch it to drop
      # every write, which needs the module - and a cloud kernel may ship it in linux-modules-extra
      # rather than in the base package. Loaded here, so that a kernel without it is this step's
      # named failure rather than a test's. The tests themselves fail rather than skip without it.
      - name: Load dm-flakey for the power-cut tests
        run: |
          if ! sudo modprobe dm-flakey 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe dm-flakey
          fi
          sudo dmsetup targets | grep -q '^flakey'

      # The previous version's server, for test_mixed_versions.py (#56): built from the revision
      # scripts/previous_version.txt names, in a worktree of its own and plain - it is the other side
      # of an upgrade, not the build under test. Without it the module fails here rather than skip.
      - name: Build the previous version's server
        run: |
          PREV=$(grep -v '^#' scripts/previous_version.txt | head -1)
          git fetch --no-tags --depth=1 origin "$PREV"
          git worktree add --detach "$RUNNER_TEMP/engine-prev" "$PREV"
          cmake -S "$RUNNER_TEMP/engine-prev" -B "$RUNNER_TEMP/engine-prev/build" \
            -DCMAKE_BUILD_TYPE=Debug -DOB_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/engine-prev/build" -j$(nproc) --target ob_tcp_server
          "$RUNNER_TEMP/engine-prev/build/ob_tcp_server" --help > /dev/null
          echo "OB_PREVIOUS_SERVER_BINARY=$RUNNER_TEMP/engine-prev/build/ob_tcp_server" >> "$GITHUB_ENV"

      # The harness starts its own etcd per cluster, so nothing is started here. Binance tests are
      # opt-in and stay skipped without OB_BINANCE_TESTS. The power-cut tests are opt-in locally
      # and switched on here, and the skip gate below is what keeps them on (#160).
      - name: Run the integration suite
        env:
          OB_INTEGRATION_TESTS: "1"
          OB_POWER_CUT_TESTS: "1"
          OB_KEEP_FAILED_NODE_LOGS: ${{ github.workspace }}/failed-node-logs
        run: |
          PYTHONPATH=$PWD/python .venv/bin/python -m pytest tests/integration/ -q \
            --junitxml=integration-report.xml

      # The nodes' own logs of a test that failed, which otherwise go with the harness's temporary
      # directories: PR #188's first run failed here with an assertion and nothing else, and its
      # reproduction had to find the window again from scratch. `always()` by the rule the TSan
      # job's report step states - evidence that exists only on the runner - and a green run keeps
      # nothing, so there is nothing to upload.
      - name: Upload the node logs of a failed test
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: failed-node-logs
          path: failed-node-logs/
          if-no-files-found: ignore
          retention-days: 14

      # A skip is a test that did not run, and the only ones this job accepts are the two Binance
      # tests that need a live feed. Anything else — a binary the build step forgot, a fixture that
      # gave up, a marker added without thinking — would otherwise pass as green. A strict xfail is
      # a test that ran and failed the way an open roadmap item says it does, and the report files
      # it as a skip all the same, so the gate reads its reason: it has to name an item the
      # roadmap's Open line lists (PR #187, whose five xfails turned this red over 407 passes).
      # The gate tests itself first, so a change that makes it accept everything fails here.
      - name: No test may skip except the two opt-in Binance ones, or xfail but for an open item
        if: always()
        run: |
          python3 scripts/check_integration_skips.py --self-test
          python3 scripts/check_integration_skips.py integration-report.xml docs/roadmap.md

  release-build:
    name: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev

      - name: Configure (Release, no tests)
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DOB_BUILD_TESTS=OFF

      - name: Build server
        run: cmake --build build-release -j$(nproc)

      - name: Smoke check
        run: |
          ./build-release/ob_tcp_server --port 5599 --data-dir /tmp/ci-smoke &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if printf 'PING\n' | timeout 2 nc -q1 127.0.0.1 5599 | grep -q PONG; then
              echo "PONG received"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "server did not answer PING"
          kill $SERVER_PID || true
          exit 1

  # Clang, because the README and CLAUDE.md both claim GCC >= 12 / Clang >= 15 and nothing had ever
  # checked the second half of that sentence.
  #
  # One job rather than a GCC/Clang x Debug/Release matrix: build-and-test already covers GCC Debug
  # with the full suite and release-build covers GCC Release, so a matrix would spend most of its
  # time re-running what is already required. The missing combination was Clang, and this covers
  # both configurations of it.
  clang-build:
    name: clang-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang \
            liblz4-dev libcurl4-openssl-dev
          clang++ --version

      # etcd for the handful of C++ tests that talk to a coordinator.
      - name: Install etcd
        env:
          ETCD_VER: v3.5.17
        run: |
          # Retries because this one line has already failed a required check on somebody
          # else's network: `curl: (35) Recv failure: Connection reset by peer`, mid-transfer,
          # on the coverage job of PR #93. A required check that cannot be re-run without a
          # human is a merge block, and an infrastructure block is indistinguishable from a
          # real finding until somebody reads the log.
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz" | tar xz
          sudo install -m755 "etcd-${ETCD_VER}-linux-amd64/etcd" "etcd-${ETCD_VER}-linux-amd64/etcdctl" /usr/local/bin/

      - name: Start etcd
        run: |
          etcd --name ci-etcd --data-dir /tmp/ci-etcd \
            --advertise-client-urls http://127.0.0.1:2379 \
            --listen-client-urls http://127.0.0.1:2379 \
            > /tmp/ci-etcd.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:2379/version && break
            sleep 1
          done
          curl -sf http://127.0.0.1:2379/version

      - name: Configure and build with clang (Debug)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-clang -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-clang -j$(nproc)

      # -j1 for the same reason as everywhere else: the networking tests bind fixed ports.
      - name: Test (clang, Debug)
        run: ctest --test-dir build-clang --output-on-failure -j1

      # Release too, because -O2/-O3 turns on diagnostics that -O0 does not reach — the class of
      # warning that only appears once the optimiser can see through a function.
      - name: Configure and build with clang (Release)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-clang-release -DCMAKE_BUILD_TYPE=Release -DOB_BUILD_TESTS=OFF
          cmake --build build-clang-release -j$(nproc)

  # Line coverage over the engine's own sources, reported and not (yet) gated.
  #
  # Required, and gated on a floor taken from a measurement rather than from taste.
  #
  # The first honest run reported **61.0% of 11352 lines** (functions 72.5%, branches 33.4%) across
  # 33 source files. Before #83 the same option reported "59.0% of 2387 lines" over 6 files — nearly
  # the same percentage of an unrepresentative sixth, which is what made it worth nothing.
  #
  # The floor is 58%: three points of slack, so ordinary churn does not trip it and a real drop does.
  # Branches are not gated — 33% is too far from anything to be a useful ratchet yet, and a floor
  # nobody can raise is a floor nobody respects.
  #
  # It also gates three things that are not percentages: the tree builds with coverage, the suite
  # passes under it, and the instrumentation still reaches the libraries. The last of those failed
  # silently for as long as the option existed.
  #
  # No third-party service. Every coverage badge on offer means sending reports from a public
  # repository to somebody else's account, which is a decision with an owner rather than a task, so
  # the number lands in the job summary and stays here.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev
          python3 -m pip install --quiet gcovr

      # etcd for the C++ tests that talk to a coordinator; without it their lines read as uncovered
      # and the number understates the suite rather than describing it.
      - name: Install etcd
        env:
          ETCD_VER: v3.5.17
        run: |
          # Retries because this one line has already failed a required check on somebody
          # else's network: `curl: (35) Recv failure: Connection reset by peer`, mid-transfer,
          # on the coverage job of PR #93. A required check that cannot be re-run without a
          # human is a merge block, and an infrastructure block is indistinguishable from a
          # real finding until somebody reads the log.
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz" | tar xz
          sudo install -m755 "etcd-${ETCD_VER}-linux-amd64/etcd" "etcd-${ETCD_VER}-linux-amd64/etcdctl" /usr/local/bin/

      - name: Configure and build with coverage
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DOB_ENABLE_COVERAGE=ON
          cmake --build build-cov -j$(nproc)

      # A quick check that the instrumentation actually reached the libraries, because that is the
      # defect this job was born out of and it failed silently for as long as it existed (#83).
      - name: The instrumentation must reach the libraries
        run: |
          for target in orderbook_engine orderbook_multi_master orderbook_failover; do
            flags="build-cov/CMakeFiles/${target}.dir/flags.make"
            if ! grep -q -- "--coverage" "$flags"; then
              echo "::error::${target} is not instrumented; coverage would describe part of the tree"
              exit 1
            fi
            echo "${target}: instrumented"
          done

      - name: Run the suite
        run: ctest --test-dir build-cov --output-on-failure -j1

      - name: Report coverage
        run: |
          # negative_hits.warn: gcov emits negative execution counts for a few of wal.cpp's lines,
          # and gcovr treats an unparseable count as fatal by default. They come from tests that
          # abandon a process on purpose — crash recovery is tested by killing the engine rather than
          # closing it — which leaves a partially written .gcda. Warn and carry on: the alternative is
          # no coverage number at all, and the lines affected are the ones a deliberately killed
          # process was executing.
          #
          # It did not appear locally before this change, for the reason this change is about:
          # wal.cpp was not instrumented.
          gcovr --root . \
                --filter 'src/' --filter 'include/orderbook/' \
                --exclude 'tests/' --exclude 'build.*' \
                --gcov-ignore-parse-errors=negative_hits.warn \
                --txt-metric line --print-summary \
                --txt coverage.txt --json-summary coverage.json
          {
            echo '### Line coverage'
            echo
            echo '```'
            python3 -c "
          import json
          d = json.load(open('coverage.json'))
          print(f\"lines     {d['line_percent']:.1f}%  ({d['line_covered']}/{d['line_total']})\")
          print(f\"functions {d['function_percent']:.1f}%  ({d['function_covered']}/{d['function_total']})\")
          print(f\"branches  {d['branch_percent']:.1f}%  ({d['branch_covered']}/{d['branch_total']})\")
          "
            echo '```'
            echo
            echo '<details><summary>Per file</summary>'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Line coverage must not fall below the floor
        run: |
          python3 - <<'PY'
          import json, sys
          FLOOR = 58.0
          d = json.load(open("coverage.json"))
          pct = d["line_percent"]
          print(f"line coverage {pct:.1f}% (floor {FLOOR}%), {d['line_covered']}/{d['line_total']} lines")
          if pct < FLOOR:
              print(f"::error::line coverage {pct:.1f}% is below the {FLOOR}% floor")
              sys.exit(1)
          PY

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.json

  # Sanitizers on the C++ unit suite. Both were clean when introduced, and each found a real defect
  # on the way in: UBSan a misaligned reference binding caused by packing HLCTimestamp (roadmap
  # #37), TSan a shutdown that closed the epoll descriptor while the io thread was still inside
  # epoll_wait().
  #
  # This used to carry a note explaining that running the integration suite under a sanitizer would
  # "multiply the runtime without adding coverage of anything the unit tests do not reach". That
  # turned out to be wrong, and expensively so: thirteen seconds of test_mm_convergence.py against a
  # TSan build reported a lock-order inversion on all three nodes and seventeen data races on the
  # shutdown path (#80). Unit tests never start a server process with real clients, real peers and a
  # signal-driven shutdown, so that whole class was outside the reach of a job that exists to find
  # it. Hence the second job below.
  sanitizers:
    name: sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev

      # ThreadSanitizer refuses to start when the kernel hands out more ASLR entropy than its
      # shadow mapping allows: "FATAL: ThreadSanitizer: unexpected memory mapping". Ubuntu 24.04
      # defaults to 32 bits; 28 is what TSan can live with. Harmless for the ASan job, so it is not
      # conditional.
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DOB_ENABLE_ASAN=ON
          else
            cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DOB_ENABLE_TSAN=ON
          fi

      - name: Build
        run: cmake --build build-san -j$(nproc)

      # -j1 for the same reason as the ordinary suite: the networking tests bind ports.
      - name: Run tests
        env:
          # detect_leaks is on: a leak in a long-lived server process is a defect, not noise.
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1
        run: ctest --test-dir build-san --output-on-failure -j1

  # The integration suite under ThreadSanitizer, with the deadlock detector on.
  #
  # A separate job rather than a matrix entry on the one above, because it needs etcd, Python and a
  # live cluster, and because what it looks for is different: lock order and cross-thread access in
  # a running server, not memory errors in a unit test. Any report at all fails the job — TSan runs
  # with halt_on_error=0 so that one finding does not hide the next, which means pytest can pass
  # while the logs are full.
  #
  # Scope is the multi-master modules: they are the ones that drive both lock orders at once (a
  # client write going Engine -> MM against a received delta going MM -> Engine). The modules that
  # kill nodes are left out for now — their fixtures wait on timeouts that instrumentation makes
  # unreliable, and a flaky required check teaches people to ignore checks.
  # ── Packaging ───────────────────────────────────────────────────────────────
  #
  # Everything a release does but publish, on both architectures, on every pull request (#42). A job
  # first exercised on a tag is a job first exercised at the moment it matters most: CPack failures
  # are configuration failures that show up only when a generator actually runs, and the first time
  # an aarch64 package is built must not be the day of a release. One script, scripts/package_ci.sh,
  # for both jobs and for release.yml's, so the three cannot drift apart. Two jobs rather than a
  # matrix because the ruleset requires `package` by name, and has since long before aarch64.
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-dev libcurl4-openssl-dev rpm python3-venv
          # rpm brings rpmbuild, which is what makes the RPM generator appear. Without it CMake
          # configures DEB and TGZ only - see the note by CPACK_GENERATOR.

      - name: Build, package, check, install and accept
        run: ./scripts/package_ci.sh build-pkg dist

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-x86_64
          path: |
            build-pkg/orderbook-dbengine_*.deb
            build-pkg/orderbook-dbengine-*-Linux-*.tar.gz
            build-pkg/orderbook-dbengine-*.rpm
            dist/*
          if-no-files-found: error

  package-arm64:
    name: package-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-dev libcurl4-openssl-dev rpm python3-venv

      - name: Build, package, check, install and accept
        run: ./scripts/package_ci.sh build-pkg dist

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-aarch64
          path: |
            build-pkg/orderbook-dbengine_*.deb
            build-pkg/orderbook-dbengine-*-Linux-*.tar.gz
            build-pkg/orderbook-dbengine-*.rpm
          if-no-files-found: error

  sanitizers-integration:
    name: sanitizers-integration (tsan)
    runs-on: ubuntu-24.04
    # The battery under ThreadSanitizer took 41:25 on PR #199's run, and with the build that was the
    # whole of 45 minutes: PR #200's run was canceled at 83%, every test so far passing, on a runner
    # 3% slower. The margin, not a slower suite.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            liblz4-dev libcurl4-openssl-dev

      - name: Install etcd
        run: |
          ETCD_VER=v3.5.17
          # `-f` as well as the retries: without it an HTTP error page is piped into `tar`,
          # which fails with "unexpected end of file" instead of naming the download.
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL \
            https://github.com/etcd-io/etcd/releases/download/$ETCD_VER/etcd-$ETCD_VER-linux-amd64.tar.gz | tar xz
          sudo install -m755 etcd-$ETCD_VER-linux-amd64/etcd etcd-$ETCD_VER-linux-amd64/etcdctl /usr/local/bin/
          etcd --version

      # Same reason as the job above: TSan refuses to start under Ubuntu 24.04's default ASLR
      # entropy.
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # The CLI embeds the engine, so its tests must use this instrumented build too (#110).
      - name: Configure and build the server, CLI and client harness under TSan
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DOB_ENABLE_TSAN=ON -DOB_BUILD_TESTS=ON
          cmake --build build-tsan -j$(nproc) --target ob_tcp_server ob_cli ob_integration_test obfault \
            ob_restore ob_backup
          test -f build-tsan/tests/libobfault.so
          # obfault is the storage fault injector (#54), and it has to be built from *this* tree:
          # `fault_injector_path()` derives it from OB_SERVER_BINARY, so a shim taken from the
          # plain build would be preloaded into a TSan server - pitfall 77's shape, with a
          # sanitizer runtime involved.
          # ob_integration_test as well as the server: test_cpp_client.py skips all seven of its
          # tests when that binary is absent, and a skipped integration test is indistinguishable
          # from a passing one in a summary line. Building it puts the C++ client's wire handling
          # under TSan too, which is where a client and a server disagreeing about bytes would show.

      - name: Install Python package and test extras
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -e ".[test]"

      # The power-cut tests (#160) put a node's data directory on dm-flakey and switch it to drop
      # every write, which needs the module - and a cloud kernel may ship it in linux-modules-extra
      # rather than in the base package. Loaded here, so that a kernel without it is this step's
      # named failure rather than a test's. The tests themselves fail rather than skip without it.
      - name: Load dm-flakey for the power-cut tests
        run: |
          if ! sudo modprobe dm-flakey 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe dm-flakey
          fi
          sudo dmsetup targets | grep -q '^flakey'

      # The whole battery, not a subset — and the subset is what hid #85 for months.
      #
      # This job used to run three multi-master modules. None of them starts the failover monitor,
      # because multi-master has no election, so `FailoverManager::publish_position_if_due()` was
      # never on a TSan build — and that is where the WAL position race lived. The subset had been
      # chosen around the defect we were fixing when the job was written (#80), which is exactly the
      # shape of gap #80 itself was about: coverage justified by an argument that stops being true.
      #
      # Cost, stated: this takes minutes rather than the two the subset took, because TSan slows the
      # server and the battery is ~154 tests. That is the price of a check that speaks for the whole
      # tree. Verified clean per module before switching it on — all 19 modules, zero reports.
      #
      # Binance modules are excluded because they need the live feed and skip without it, which in a
      # summary line is indistinguishable from passing.
      # The previous version's server, for test_mixed_versions.py (#56): built from the revision
      # scripts/previous_version.txt names, in a worktree of its own and plain - it is the other side
      # of an upgrade, not the build under test. Without it the module fails here rather than skip.
      - name: Build the previous version's server
        run: |
          PREV=$(grep -v '^#' scripts/previous_version.txt | head -1)
          git fetch --no-tags --depth=1 origin "$PREV"
          git worktree add --detach "$RUNNER_TEMP/engine-prev" "$PREV"
          cmake -S "$RUNNER_TEMP/engine-prev" -B "$RUNNER_TEMP/engine-prev/build" \
            -DCMAKE_BUILD_TYPE=Debug -DOB_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/engine-prev/build" -j$(nproc) --target ob_tcp_server
          "$RUNNER_TEMP/engine-prev/build/ob_tcp_server" --help > /dev/null
          echo "OB_PREVIOUS_SERVER_BINARY=$RUNNER_TEMP/engine-prev/build/ob_tcp_server" >> "$GITHUB_ENV"

      - name: Run the integration battery against the TSan server
        env:
          OB_INTEGRATION_TESTS: "1"
          OB_POWER_CUT_TESTS: "1"
          OB_SERVER_BINARY: ${{ github.workspace }}/build-tsan/ob_tcp_server
          OB_KEEP_FAILED_NODE_LOGS: ${{ github.workspace }}/failed-node-logs
          TSAN_OPTIONS: detect_deadlocks=1:second_deadlock_stack=1:halt_on_error=0:log_path=${{ github.workspace }}/tsan-report
        run: |
          set -o pipefail
          PYTHONPATH=$PWD/python .venv/bin/python -m pytest -q -rs \
            --ignore=tests/integration/test_binance_live.py \
            --ignore=tests/integration/test_binance_failover_sync.py \
            --junitxml=tsan-integration-report.xml \
            tests/integration/ | tee tsan-pytest.log

      # A skip in this job is a failure, and that is not pedantry — it is the defect this job just
      # had. Three modules built their own path to `build/ob_tcp_server`, ignored OB_SERVER_BINARY,
      # and therefore **skipped** in CI: fourteen tests reported as skips in a summary nobody reads,
      # while the job stayed green and claimed to speak for the battery. `test_cpp_client.py` skipped
      # another seven for a missing binary. The same shape as the SDE repository's step that checks
      # its PostgreSQL cross-section did not skip.
      # `if: always()`, and this is not belt-and-braces — a step placed after a failing step is
      # **skipped**, so this guard and the report below only ever ran when they had nothing to say.
      - name: Fail if anything skipped, or xfailed but for an open item
        if: always()
        run: |
          if [ ! -f tsan-integration-report.xml ]; then
            echo "No report: the battery step did not get far enough to produce one."
            exit 0
          fi
          # The report, not a count read out of the summary. That count was the guard until PR
          # #187, and it was right to be a count rather than the word - the first version matched
          # "[0-9]+ skipped", and the summary reads "0 skipped" - but a count in a summary line is
          # whatever the line's author counted: this battery's own summary filed the first strict
          # xfails as "5 skipped". The same script as the uninstrumented job's gate, so both jobs
          # hold a skip and an xfail to one rule.
          python3 scripts/check_integration_skips.py --self-test
          python3 scripts/check_integration_skips.py tsan-integration-report.xml docs/roadmap.md

      # Evidence for the leading hypothesis about #86, and it costs two seconds. ThreadSanitizer
      # multiplies a process's footprint, this job runs three nodes plus etcd on one shared runner,
      # and an OOM kill arrives as SIGKILL with no report of any kind — indistinguishable, from the
      # test's side, from a node that closed its listener on purpose. The kernel says so plainly if
      # anybody asks it.
      # As in the uninstrumented job.
      - name: Upload the node logs of a failed test
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: failed-node-logs-tsan
          path: failed-node-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Memory, and whether the kernel killed anything
        if: always()
        run: |
          free -m || true
          echo "── kernel OOM lines, if any ──"
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" || echo "none"

      # The step that explains a failure must run **on** failure. Three consecutive red runs of
      # this job were diagnosed blind because this step sat behind the one that failed: any race
      # report ThreadSanitizer wrote was deleted with the runner, unread. The same shape as a
      # required job nobody requires — coverage that exists only when it is not needed.
      #
      # The rule this follows, so that its absence elsewhere is a decision and not an oversight:
      # `if: always()` belongs on a step that surfaces **evidence which exists only on the runner**.
      # A race report from a loaded shared runner is that; a coverage percentage from a suite that
      # failed is not a measurement at all, and a `.deb` that failed verification rebuilds locally
      # in a minute. `coverage` and `package` were both checked against this and left alone.
      - name: Fail on any ThreadSanitizer report
        if: always()
        run: |
          shopt -s nullglob
          reports=(tsan-report.*)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No ThreadSanitizer reports."
            exit 0
          fi
          echo "ThreadSanitizer wrote ${#reports[@]} report file(s):"
          for f in "${reports[@]}"; do
            echo "──────── $f ────────"
            cat "$f"
          done
          exit 1

  # Fuzzing the three places that read untrusted bytes: the wire command parser, the multi-master
  # frame decoder and WAL record deserialisation (#38).
  #
  # Bounded on purpose. This is a regression gate, not a campaign: sixty seconds per harness catches
  # what a mutated corpus reaches quickly and keeps the job inside the wall clock of every other one.
  # A real campaign runs for hours and belongs on a developer's machine - `fuzz/README.md` says how.
  # What makes the short run worth having is the committed corpus: every seed is executed on every
  # pull request, so a parser that stops refusing one of them fails here deterministically.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install system dependencies
        # libclang-rt-dev is named explicitly and that is not redundant: the sanitizer and
        # libFuzzer runtime archives live there, and `libclang-common-N-dev` only *Recommends* it.
        # Every other job here installs with --no-install-recommends and never needed it, because
        # none of them links a sanitizer under Clang. Without this line the harnesses compile and
        # fail at link on a missing libclang_rt.fuzzer-x86_64.a. The unversioned metapackage
        # follows the runner's default Clang, the same way the `clang` metapackage does.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-rt-dev \
            liblz4-dev libcurl4-openssl-dev libssl-dev
          clang++ --version

      - name: Configure the fuzzing tree (Clang, libFuzzer, ASan + UBSan)
        # OB_BUILD_FUZZERS refuses GCC and refuses to run without OB_ENABLE_ASAN, so an incomplete
        # request fails at configure time instead of producing harnesses that explore their own
        # drivers. Debug with -O1 and frame pointers, matching the sanitizer trees: -O0 hides
        # optimisation-dependent bugs and -O2 loses the stack detail that makes a report actionable.
        run: >-
          cmake -S . -B build-fuzz
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DOB_BUILD_FUZZERS=ON -DOB_ENABLE_ASAN=ON -DOB_BUILD_TESTS=OFF

      - name: Build the three harnesses
        run: >-
          cmake --build build-fuzz -j$(nproc)
          --target fuzz_command_parser fuzz_mm_frames fuzz_wal_replay

      - name: Verify the instrumentation reached the production parsers
        # A harness whose parser was compiled without coverage instrumentation explores the driver
        # and reports nothing about the parser, while every step here stays green. That already
        # happened in this repository's sanitizer build (#83), so this reads the compiler's own
        # command lines rather than CMakeLists.txt, and fails on a missing file or an empty corpus
        # instead of finding no problems in nothing.
        run: python3 fuzz/verify_instrumentation.py build-fuzz

      - name: Every binary is present
        # Named separately from the build because "the target was up to date" and "the executable
        # exists" are different claims, and the second one is what the next two steps need.
        run: |
          for harness in command_parser mm_frames wal_replay; do
            test -x "build-fuzz/fuzz/fuzz_$harness"
          done

      - name: Run every versioned seed
        # The deterministic half. There is no pipe anywhere in this job: the fuzzer's exit code is
        # the result, and `| tee` or `| grep` would replace it with the exit code of the filter.
        run: |
          mkdir -p build-fuzz/fuzz-logs
          for harness in command_parser mm_frames wal_replay; do
            ./build-fuzz/fuzz/fuzz_$harness fuzz/corpus/$harness/* \
              > "build-fuzz/fuzz-logs/seeds-$harness.log" 2>&1
          done

      - name: Bounded campaign, one harness at a time
        # Sequential, because two fuzzers on one runner share its cores and each would then be
        # measuring the other's RSS against its own limit. Budgets: 60 s per harness, 10 s per
        # input, 1 GiB RSS. Maximum input 64 KiB for commands and frames; 128 KiB for the WAL,
        # which has to hold a maximum payload plus its header.
        run: |
          mkdir -p build-fuzz/fuzz-logs build-fuzz/artifacts \
                   build-fuzz/fuzz-corpus/command_parser \
                   build-fuzz/fuzz-corpus/mm_frames \
                   build-fuzz/fuzz-corpus/wal_replay
          budget="-max_total_time=60 -timeout=10 -rss_limit_mb=1024 -print_final_stats=1"
          ./build-fuzz/fuzz/fuzz_command_parser \
            build-fuzz/fuzz-corpus/command_parser fuzz/corpus/command_parser \
            -dict=fuzz/command_parser.dict -max_len=65536 $budget \
            -artifact_prefix=build-fuzz/artifacts/command_parser- \
            > build-fuzz/fuzz-logs/campaign-command_parser.log 2>&1
          ./build-fuzz/fuzz/fuzz_mm_frames \
            build-fuzz/fuzz-corpus/mm_frames fuzz/corpus/mm_frames \
            -max_len=65536 $budget \
            -artifact_prefix=build-fuzz/artifacts/mm_frames- \
            > build-fuzz/fuzz-logs/campaign-mm_frames.log 2>&1
          ./build-fuzz/fuzz/fuzz_wal_replay \
            build-fuzz/fuzz-corpus/wal_replay fuzz/corpus/wal_replay \
            -max_len=131072 $budget \
            -artifact_prefix=build-fuzz/artifacts/wal_replay- \
            > build-fuzz/fuzz-logs/campaign-wal_replay.log 2>&1

      - name: Keep the logs and any reproducer
        # `if: always()`, because the run that matters is the one that failed. A crash leaves the
        # input under build-fuzz/artifacts/, and that file plus the log is everything needed to
        # reproduce it with one command from fuzz/README.md.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz
          path: |
            build-fuzz/fuzz-logs/
            build-fuzz/artifacts/
          if-no-files-found: error
