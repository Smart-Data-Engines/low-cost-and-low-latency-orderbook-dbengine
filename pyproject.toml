[build-system]
requires = ["scikit-build-core>=0.8", "cmake>=3.20"]
build-backend = "scikit_build_core.build"

[project]
name = "orderbook-dbengine"
version = "0.1.0"
description = "Low-latency Level 2 orderbook database engine for HFT"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "kmacewicz"},
]
keywords = ["orderbook", "hft", "database", "trading", "low-latency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Office/Business :: Financial :: Investment",
]

# The client needs no third-party package for the plain protocol. LZ4 session
# compression does, so it is an extra rather than a hard dependency: an install
# that never sets compress=True should not pull a binary wheel it will not use.
[project.optional-dependencies]
compression = ["lz4>=4.0"]
test = ["pytest>=7.0", "pytest-timeout>=2.1", "requests>=2.28", "lz4>=4.0"]

[project.urls]
Homepage = "https://github.com/Smart-Data-Engines/low-cost-and-low-latency-orderbook-dbengine"
Repository = "https://github.com/Smart-Data-Engines/low-cost-and-low-latency-orderbook-dbengine"
Documentation = "https://github.com/Smart-Data-Engines/low-cost-and-low-latency-orderbook-dbengine/tree/master/docs"

[tool.scikit-build]
cmake.build-type = "Release"
# build.targets, not cmake.targets: scikit-build-core >= 0.10 rejects the old
# name outright, which made `pip install .` fail before it started compiling.
build.targets = ["orderbook_shared"]
cmake.define = {"OB_BUILD_TESTS" = "OFF"}
wheel.packages = ["python/orderbook_engine"]
